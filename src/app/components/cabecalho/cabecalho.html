<nav aria-label="Navegação principal">
  <a routerLink="/" class="marca">
    <img src="/GALARRAGA_EVENTOS_PI.png" alt="" width="42" height="42"> Galarraga Eventos
  </a>
  <div class="g-flex">
    <a class="g-link" routerLink="/" fragment="eventos">Eventos</a>
    @if (sessao.usuario(); as usuario) {
      @if (usuario.role === 'ADMIN') { <a class="g-link" routerLink="/dashboardadm">Painel</a> }
      <a class="g-link" routerLink="/perfil">Minha conta</a>
      <button class="g-acao g-secundario" type="button" (click)="sair()">Sair</button>
    } @else {
      <a class="g-link" routerLink="/cadastro">Criar conta</a>
      <a class="g-acao" routerLink="/login">Entrar</a>
    }
  </div>
</nav>
