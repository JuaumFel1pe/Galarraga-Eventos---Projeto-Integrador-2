<nav aria-label="Navegação principal">
  <a routerLink="/" class="marca">
    <img src="logo-cabecalho.png" alt="" width="31" height="31">
    <span>Galarraga Eventos</span>
  </a>
  <div class="acoes">
    <a class="acao eventos" routerLink="/" fragment="eventos">Eventos</a>
    @if (sessao.usuario(); as usuario) {
      @if (usuario.role === 'ADMIN') { <a class="acao painel" routerLink="/dashboardadm">Painel</a> }
      <a class="acao minha-conta" routerLink="/perfil">Minha conta</a>
      <button class="acao sair" type="button" (click)="sair()">Sair</button>
    } @else {
      <a class="acao criar-conta" routerLink="/cadastro">Criar conta</a>
      <a class="acao entrar" routerLink="/login">Entrar</a>
    }
  </div>
</nav>
