<section>
    <span id="separador"></span>

    <h1><span id="cor">Eventos</span> Disponíveis</h1>

   <div class="eventos">

  @for(evento of evento; track evento.id){
    <div class="card" [routerLink]="['/evento', evento.id]">

      <div class="img-container">
        <img [src]="evento?.urlImg">
      </div>

      <span class="separador-card"></span>

      <h3>{{ evento?.nome }}</h3>

    </div>
  }

</div>
</section>
