<footer>
  <strong>Galarraga Eventos</strong>
  @if (dados(); as contato) {
    <address>{{contato.endereco}}</address>
    <a [href]="'mailto:' + contato.email">{{contato.email}}</a>
    <span>{{contato.telefone}}</span>
    <div class="g-flex">
      @if (contato.instagram) { <a [href]="contato.instagram" rel="noopener noreferrer" target="_blank">Instagram</a> }
      @if (contato.facebook) { <a [href]="contato.facebook" rel="noopener noreferrer" target="_blank">Facebook</a> }
      @if (contato.linkedin) { <a [href]="contato.linkedin" rel="noopener noreferrer" target="_blank">LinkedIn</a> }
      @if (contato.twitter) { <a [href]="contato.twitter" rel="noopener noreferrer" target="_blank">X</a> }
    </div>
  }
</footer>
