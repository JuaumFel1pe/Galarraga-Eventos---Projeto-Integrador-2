<app-cabecalho-adm />

<div class="admin-layout">
  <aside class="sidebar">
    <app-menu-lateral-adm />
  </aside>

  <main class="admin-content">
<div class="page-container">
  <div class="form-content">
    
    <div class="header-title">
      <h1 class="outline-title">ADICIONAR/<br>EDITAR</h1>
    </div>

    <form class="event-form" (ngSubmit)="salvarEvento()">
      
      <div class="form-group-row">
        <label>URL da imagem</label>
        <input type="text" name="urlImagem" [(ngModel)]="evento.urlImagem">
      </div>

      <div class="form-group-row">
        <label>Título do evento</label>
        <input type="text" name="titulo" [(ngModel)]="evento.titulo">
      </div>

      <div class="form-group-row">
        <label>Endereço</label>
        <input type="text" name="endereco" [(ngModel)]="evento.endereco">
      </div>

      <div class="form-row-split">
        <div class="field-cell">
          <label>Data e hora</label>
          <input type="text" name="dataHora" [(ngModel)]="evento.dataHora">
        </div>
        
        <div class="field-cell short-cell">
          <label>Preço</label>
          <input type="text" name="preco" [(ngModel)]="evento.preco">
        </div>
      </div>

      <div class="form-row-split">
        <div class="field-cell">
          <label>Qtd. de ingressos</label>
          <input type="text" name="qtdIngressos" [(ngModel)]="evento.qtdIngressos">
        </div>
        
        <div class="field-cell toggle-cell">
          <label>Inativar evento</label>
          <label class="switch">
            <input type="checkbox" name="inativar" [(ngModel)]="evento.inativar">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <hr class="purple-divider">

      <div class="form-group-vertical">
        <label>Descrição do evento</label>
        <textarea name="descricao" rows="6" [(ngModel)]="evento.descricao" placeholder="Venha participar da nossa festa de Natal!!"></textarea>
      </div>

      <div class="submit-action">
        <button type="submit" class="btn-salvar">Salvar</button>
      </div>
    </form>

  </div>
</div>
