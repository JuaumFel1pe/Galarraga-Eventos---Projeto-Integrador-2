<app-cabecalho-adm />
<div class="g-admin">
  <app-menu-lateral-adm />
  <main class="g-container g-pilha">
    <h1 class="g-titulo">Configurações</h1>
    @if (erro()) { <p class="g-alerta" role="alert">{{ erro() }}</p> }
    @if (salvo()) { <p class="g-sucesso" role="status">Configurações salvas.</p> }
    @if (dados(); as config) {
      <form class="g-card g-pilha" ngNativeValidate #form="ngForm" (ngSubmit)="form.valid && salvar(config)">
        <h2>Contato e redes sociais</h2>
        <label class="g-campo">Endereço <input name="endereco" required maxlength="300" [(ngModel)]="config.endereco"></label>
        <div class="g-grid">
          <label class="g-campo">E-mail <input type="email" name="email" email required maxlength="150" [(ngModel)]="config.email"></label>
          <label class="g-campo">Telefone <input type="tel" name="telefone" required maxlength="20" [(ngModel)]="config.telefone"></label>
        </div>
        <div class="g-grid">
          <label class="g-campo">Instagram <input type="url" name="instagram" maxlength="255" [(ngModel)]="config.instagram"></label>
          <label class="g-campo">Facebook <input type="url" name="facebook" maxlength="255" [(ngModel)]="config.facebook"></label>
          <label class="g-campo">LinkedIn <input type="url" name="linkedin" maxlength="255" [(ngModel)]="config.linkedin"></label>
          <label class="g-campo">X <input type="url" name="twitter" maxlength="255" [(ngModel)]="config.twitter"></label>
        </div>
        <div><button class="g-acao" [disabled]="enviando()">{{ enviando() ? 'Salvando…' : 'Salvar' }}</button></div>
      </form>
    } @else if (!erro()) { <p class="g-nota" role="status">Carregando configurações…</p> }
  </main>
</div>
