<app-cabecalho />
<div class="event-page">

  <header class="event-header">
    <div class="header-info">
      <h1>{{ evento?.nome }}</h1>
      <ul class="event-details">
        <li>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M9.33333 1.16667V3.5M4.66667 1.16667V3.5M1.75 5.83334H12.25M2.91667 2.33334H11.0833C11.7277 2.33334 12.25 2.85567 12.25 3.5V11.6667C12.25 12.311 11.7277 12.8333 11.0833 12.8333H2.91667C2.27233 12.8333 1.75 12.311 1.75 11.6667V3.5C1.75 2.85567 2.27233 2.33334 2.91667 2.33334Z"
              stroke="#CB6CE6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>{{ evento?.dataHora }}</span>
        </li>
        <li>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip0_322_494)">
              <path
                d="M7.00002 3.50001V7.00001L9.33335 8.16667M12.8334 7.00001C12.8334 10.2217 10.2217 12.8333 7.00002 12.8333C3.77836 12.8333 1.16669 10.2217 1.16669 7.00001C1.16669 3.77834 3.77836 1.16667 7.00002 1.16667C10.2217 1.16667 12.8334 3.77834 12.8334 7.00001Z"
                stroke="#CB6CE6" stroke-linecap="round" stroke-linejoin="round" />
            </g>
            <defs>
              <clipPath id="clip0_322_494">
                <rect width="14" height="14" fill="white" />
              </clipPath>
            </defs>
          </svg>

              <span> {{ formatarParaDate(evento?.dataHora || '') }}</span>
        </li>
        <li>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12.25 5.83333C12.25 9.91666 7 13.4167 7 13.4167C7 13.4167 1.75 9.91666 1.75 5.83333C1.75 4.44094 2.30312 3.10558 3.28769 2.12102C4.27226 1.13645 5.60761 0.583328 7 0.583328C8.39239 0.583328 9.72774 1.13645 10.7123 2.12102C11.6969 3.10558 12.25 4.44094 12.25 5.83333Z"
              stroke="#CB6CE6" stroke-linecap="round" stroke-linejoin="round" />
            <path
              d="M7 7.58333C7.9665 7.58333 8.75 6.79983 8.75 5.83333C8.75 4.86683 7.9665 4.08333 7 4.08333C6.0335 4.08333 5.25 4.86683 5.25 5.83333C5.25 6.79983 6.0335 7.58333 7 7.58333Z"
              stroke="#CB6CE6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <span>{{ evento?.endereco }}</span>
        </li>
      </ul>
    </div>

    <div class="header-image">
     <img [src]="evento?.urlImg">
    </div>
  </header>

  <main class="event-content">

    <section class="description">
      <h2>Descrição do evento</h2>
      <p>{{ evento?.descricao }}</p>
    </section>

    <aside class="ticket-sidebar">
      <div class="ticket-card">
        <img src="../../../../public/ticket.png" alt="">
        <p>Ingressos à <strong>{{formatarPreco(evento?.preco)}}</strong></p>
        <button class="btn-buy">Comprar Ingresso</button>
      </div>
    </aside>

  </main>
</div>
<app-rodape />
