<app-cabecalho />
<main class="login">
  <form class="login-card" [formGroup]="formulario" (ngSubmit)="entrar()">
    <h1>Entre na sua conta</h1>
    @if (mensagemErro()) {
      <p role="alert" class="error-msg">{{ mensagemErro() }}</p>
    }
    <label>E-mail
      <input type="email" formControlName="email" autocomplete="username" maxlength="150" placeholder="Informe seu e-mail">
    </label>
    <label>Senha
      <input type="password" formControlName="senha" autocomplete="current-password" maxlength="72" placeholder="Informe sua senha">
    </label>
    <button class="btn-continuar" [disabled]="enviando()">{{ enviando() ? 'Entrando…' : 'Continuar' }}</button>
    <div id="separator" aria-hidden="true"></div>
    <p class="footer-text">Não possui uma conta? <a routerLink="/cadastro" queryParamsHandling="preserve">Registre-se</a></p>
  </form>
</main>
<app-rodape />
