<app-cabecalho/>

<section class="login">

    <div class="login-card">
        <h1>Informe seus dados credenciais!</h1>

        @if(mensagemErro){
            <div class="error-msg">
                {{mensagemErro}}
            </div>
        }
        
        <input type="email" placeholder="Informe seu E-mail" [(ngModel)]="email">
        <input type="password" placeholder="Informe sua Senha" [(ngModel)]="senha">
        
        <button class="btn-continuar" (click)="entrar()">Continuar</button>

        <div id="separator"></div>
        
        <p class="footer-text">
            Não possui uma conta? <a>Registre-se</a>
        </p>
    </div>
</section>

<app-rodape/>
