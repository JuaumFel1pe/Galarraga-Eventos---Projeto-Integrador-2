<app-cabecalho-adm />

<div class="admin-layout">
  <aside class="sidebar">
    <app-menu-lateral-adm />
  </aside>

  <main class="admin-content">

    <h1 class="titulo">EVENTOS</h1>

    <section class="filtros-card">

      <div class="linha-filtros">
        <div class="campo grande">
          <label>Nome do evento</label>
          <input type="text" [(ngModel)]="filtroNome">
        </div>

        <div class="campo pequeno">
          <label>Preço</label>
          <input type="number" [(ngModel)]="filtroPreco">
        </div>
      </div>

      <div class="linha-filtros">
        <div class="campo medio">
          <label>Data</label>
          <input type="date" placeholder="dd/mm/aaaa" [(ngModel)]="filtroData">
        </div>

        <div class="toggle-area">
          <span>Eventos inativos</span>

          <button type="button" class="toggle" [class.ativo]="mostrarInativos" (click)="toggleInativos()">
            <span></span>
          </button>
        </div>
      </div>

      <div class="acoes-filtro">
        <button class="btn-outline" (click)="filtrar()">
          Filtrar
        </button>
      </div>

    </section>

    <section class="tabela-card">

      <div class="tabela-header">
        <div>Nome do evento</div>
        <div>Data</div>
        <div>Preço</div>
        <div>Ingressos Restantes</div>
        <div></div>
        <div></div>
      </div>

      @for (evento of eventosFiltrados; track evento.id) {
      <div class="tabela-row">

        <div class="cell">
          {{ evento.nome || 'Novo evento' }}
        </div>

        <div class="cell">
          {{ evento.dataHora | date:'dd/MM/yyyy' }}
        </div>

        <div class="cell">
          {{ formatarPreco(evento.preco) }}
        </div>

        <div class="cell">
          {{ evento.qtd }}
        </div>

        <div class="cell btn-cell">
          <button class="btn-editar" [routerLink]="['/adicionar-evento', evento.id]">
            Editar
          </button>
        </div>

        <div class="cell btn-cell">
          <button class="btn-excluir" (click)="excluir(evento.id)">
            Excluir
          </button>
        </div>

      </div>
      } @empty {
      <div class="tabela-row empty-message">
        Nenhum evento encontrado.
      </div>
      }

      <div class="rodape">
        <button class="btn-outline" routerLink="/adicionar-evento">
          Adicionar evento
        </button>
      </div>

    </section>

  </main>
</div>
